services:
  web:
    build: .
    # Don't publish a host port — Coolify's Traefik proxy routes the domain to the
    # container over the internal network. Publishing 0.0.0.0:3000 collides with
    # other apps on the host that already bind it.
    expose:
      - "3000"
    environment:
      # Canonical URL used by @nuxtjs/seo (sitemap, OG tags). Override per environment.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://jcicr.cz}
    restart: unless-stopped
    healthcheck:
      # Node 22 has global fetch — no need to install curl/wget in the slim image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
